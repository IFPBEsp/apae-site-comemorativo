name: Docker Build & Publish

on:
  push:
    branches:
      - main

  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

jobs:
  validate-frontend:
    name: Validate frontend before publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_PATH: /site-comemorativo
      NEXT_PUBLIC_URL_APAE: /apae-geral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.33.4'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --shamefully-hoist
      - name: Lint frontend
        run: pnpm exec eslint .
      - name: Test frontend
        run: pnpm exec vitest run
      - name: Build frontend
        run: pnpm run build
      - name: Typecheck frontend
        run: pnpm exec tsc --noEmit

  publish:
    needs: [validate-frontend]
    name: Build & publish site comemorativo
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: IFPBEsp/APAE-INFRA/.github/workflows/docker-build-publish-image.yml@main
    with:
      context: .
      dockerfile: ./Dockerfile
      image-name: apae-site-comemorativo
      build-args: |
        NEXT_PUBLIC_BASE_PATH=/site-comemorativo
        NEXT_PUBLIC_URL_APAE=/apae-geral
      platforms: '["linux/amd64"]'
      scan-severity: "HIGH,CRITICAL"

  notify-gitops:
    name: Notify APAE-INFRA
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: gitops-dispatch

    permissions:
      contents: read

    steps:
      - name: Validate publication metadata
        shell: bash
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ needs.publish.outputs.sha-tag }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          SOURCE_REPOSITORY: ${{ needs.publish.outputs.source-repository }}
          SOURCE_COMMIT: ${{ needs.publish.outputs.source-commit }}
        run: |
          set -euo pipefail

          [[ "$IMAGE" == "ghcr.io/ifpbesp/apae-site-comemorativo" ]]
          [[ "$SOURCE_REPOSITORY" == "IFPBEsp/apae-site-comemorativo" ]]
          [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$IMAGE_TAG" == "sha-${GITHUB_SHA:0:7}" ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          echo "Metadados da imagem validados."

      - name: Generate GitOps dispatcher token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.GITOPS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.GITOPS_DISPATCH_APP_PRIVATE_KEY }}
          owner: IFPBEsp
          repositories: APAE-INFRA
          permission-contents: write

      - name: Send GitOps publication event
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ needs.publish.outputs.sha-tag }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          SOURCE_REPOSITORY: ${{ needs.publish.outputs.source-repository }}
          SOURCE_COMMIT: ${{ needs.publish.outputs.source-commit }}
        run: |
          set -euo pipefail

          [[ -n "$GH_TOKEN" ]] || {
            echo "::error::Token GitOps indisponível."
            exit 1
          }

          jq -n \
            --arg application "site-comemorativo" \
            --arg environment "dev" \
            --arg image "$IMAGE" \
            --arg image_tag "$IMAGE_TAG" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_commit "$SOURCE_COMMIT" \
            '{
              event_type: "gitops-image-published",
              client_payload: {
                application: $application,
                environment: $environment,
                image: $image,
                image_tag: $image_tag,
                image_digest: $image_digest,
                source_repository: $source_repository,
                source_commit: $source_commit
              }
            }' > "$RUNNER_TEMP/gitops-dispatch.json"

          gh api \
            --method POST \
            repos/IFPBEsp/APAE-INFRA/dispatches \
            --input "$RUNNER_TEMP/gitops-dispatch.json"

          echo "Publicação notificada ao APAE-INFRA."
