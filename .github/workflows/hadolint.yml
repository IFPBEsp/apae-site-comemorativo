name: Dockerfile Lint

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/hadolint.yml"

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    uses: IFPBEsp/APAE-INFRA/.github/workflows/hadolint-reusable.yml@f7d59d6e4ad15d8d199aebf619b5b401ffbcc2f1
    with:
      dockerfiles: |
        Dockerfile
      failure-threshold: warning
