name: Dockerfile Lint

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/hadolint.yml"

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    uses: IFPBEsp/APAE-INFRA/.github/workflows/hadolint-reusable.yml@f7c41669bcc3ea12a1ba558de134171e744e2cc8
    with:
      dockerfiles: |
        Dockerfile
      failure-threshold: warning
