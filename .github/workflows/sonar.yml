name: SonarQube Test Pipeline

on:
  push:
    branches:
      - test/sonarqube-pipeline

permissions:
  contents: read

jobs:
  sonar-frontend:
    name: Frontend Analysis (Node)
    uses: IFPBEsp/APAE-INFRA/.github/workflows/reusable-sonarqube-node.yml@158eea60661185da944981fb3ad9d76d9326502e
    with:
      project-key: "teste-apae_site-comemorativo"
      organization: "teste-apae"
      working-directory: "."
      node-version: "22"
      sonar-host-url: "https://sonarcloud.io"
      run-tests: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
