name: PR-Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  issue_comment:
    types:
      - created

jobs:
  pr-agent:
    uses: IFPBEsp/APAE-INFRA/.github/workflows/pr-agent-reusable.yml@7dde1b13757bfa3ac35df5518e3e9b2e512d139d

    with:

      extra-instructions: >
        Projeto Next.js 15 com Prisma na raiz do repositorio.
        Priorizar bugs, validacao de entradas, seguranca,
        uso correto do Prisma, legibilidade e aderencia
        aos padroes do projeto.

    secrets:
      LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
